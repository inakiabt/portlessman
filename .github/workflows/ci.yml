name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Run Unit Tests
        run: swift test --verbose

      - name: Compile Release Binary
        run: swift build -c release

      - name: Bundle macOS Application
        run: ./scripts/bundle.sh

      - name: Verify Code Signature
        run: |
          codesign -vvv --deep --strict build/Portlessman.app
          spctl --assess --type execute build/Portlessman.app || true

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portlessman-App-PR-${{ github.event.pull_request.number || github.sha }}
          path: build/Portlessman.app
          retention-days: 7
