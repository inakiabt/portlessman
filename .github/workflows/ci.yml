name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test
    # Preserve the arm64 architecture of the existing release artifacts.
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          test "$(uname -m)" = "arm64"
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: swift test --verbose

      - name: Compile Release Binary
        run: swift build -c release

      - name: Bundle macOS Application
        run: ./scripts/bundle.sh

      - name: Verify Binary Architecture
        run: test "$(lipo -archs build/Portlessman.app/Contents/MacOS/Portlessman)" = "arm64"

      - name: Verify Code Signature
        run: |
          codesign -vvv --deep --strict build/Portlessman.app
          spctl --assess --type execute build/Portlessman.app || true

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portlessman-App-PR-${{ github.event.pull_request.number || github.sha }}
          path: build/Portlessman.app
          retention-days: 7
