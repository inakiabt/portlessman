name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Release
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: ver
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          CLEAN_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Run Unit Tests
        run: swift test

      - name: Package App (.zip & .dmg)
        run: ./scripts/create_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Extract SHA-256 Checksums
        id: checksum
        run: |
          ZIP_SHA=$(cat build/Portlessman-${{ steps.ver.outputs.version }}.zip.sha256 | awk '{print $1}')
          DMG_SHA=$(cat build/Portlessman-${{ steps.ver.outputs.version }}.dmg.sha256 | awk '{print $1}')
          echo "zip_sha=${ZIP_SHA}" >> $GITHUB_OUTPUT
          echo "dmg_sha=${DMG_SHA}" >> $GITHUB_OUTPUT

      - name: Update Homebrew Cask Formula
        run: ./scripts/update_cask.py "${{ steps.ver.outputs.version }}" "${{ steps.checksum.outputs.zip_sha }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Portlessman ${{ steps.ver.outputs.tag }}
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/Portlessman-${{ steps.ver.outputs.version }}.zip
            build/Portlessman-${{ steps.ver.outputs.version }}.zip.sha256
            build/Portlessman-${{ steps.ver.outputs.version }}.dmg
            build/Portlessman-${{ steps.ver.outputs.version }}.dmg.sha256

      - name: Commit & Push Updated Cask Formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/portlessman.rb
          git commit -m "chore(cask): bump version to ${{ steps.ver.outputs.version }}" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
